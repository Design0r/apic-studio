[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "rust_thumbnails"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
profile = "release"

# uv only rebuilds a local package when one of these changes. Without the Rust
# entries it keys off pyproject.toml alone, so edits to the crate never make it
# into the venv (or into the PyInstaller bundle, which collects site-packages).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[dependency-groups]
dev = ["maturin>=1.9.4", "tomli>=2.0.1"]
