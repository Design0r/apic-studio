[project]
name = "apic-studio"
version = "0.8.0"
description = "An Asset Browser for Cinema4D"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pyside6>=6.12.0", "rust-thumbnails"]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "pyinstaller>=6.22.3",
    "ruff>=0.17.0",
    "snakeviz>=2.2.2",
]

[tool.uv.workspace]
members = ["src/apic_studio_utils"]

[tool.uv.sources]
rust-thumbnails = { workspace = true }
