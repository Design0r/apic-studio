[project]
name = "apic-studio"
version = "0.5.8"
description = "An Asset Browser for Cinema4D"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pyside6>=6.11.1", "rust-thumbnails"]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "pyinstaller>=6.21.0",
    "pyside6-stubs>=6.7.3.0",
    "ruff>=0.15.20",
    "snakeviz>=2.2.2",
]

[tool.uv.workspace]
members = ["src/apic_studio_utils"]

[tool.uv.sources]
rust-thumbnails = { workspace = true }
